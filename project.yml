# XcodeGen の定義。`.xcodeproj` は生成物（xcodegen generate で作る）
name: KnitVoice

options:
  bundleIdPrefix: com.sammy
  developmentLanguage: ja
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8R9WYLJ73B

targets:
  KnitVoice:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - SharedData
      - path: KnitVoice.storekit
        buildPhase: none
    info:
      path: Config/KnitVoice-Info.plist
      properties:
        CFBundleDisplayName: あみカウンター
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 「次」「戻る」などの声のコマンドを聞き取るためにマイクを使用します。
        NSSpeechRecognitionUsageDescription: 聞き取った声をカウントのコマンドとして認識するために音声認識を使用します。
        CFBundleURLTypes:
          - CFBundleURLName: com.sammy.knitvoice
            CFBundleURLSchemes:
              - knitvoice
        # 画面ロック中の音声認識・イヤホン操作は実機検証のうえで有効化する（審査リスクあり）
        # UIBackgroundModes:
        #   - audio
    entitlements:
      path: Config/KnitVoice.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sammy.knitvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.knitvoice
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KnitVoiceWidgets
      - target: KnitVoiceWatch

  KnitVoiceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - SharedData
    info:
      path: Config/KnitVoiceWidgets-Info.plist
      properties:
        CFBundleDisplayName: あみカウンター
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/KnitVoiceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sammy.knitvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.knitvoice.widgets
        TARGETED_DEVICE_FAMILY: "1"

  KnitVoiceWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    info:
      path: Config/KnitVoiceWatch-Info.plist
      properties:
        CFBundleDisplayName: あみカウンター
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sammy.knitvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.knitvoice.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KnitVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: KnitVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.knitvoice.tests

schemes:
  KnitVoice:
    build:
      targets:
        KnitVoice: all
        KnitVoiceTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - KnitVoiceTests
    run:
      storeKitConfiguration: KnitVoice.storekit
  KnitVoiceWatch:
    build:
      targets:
        KnitVoiceWatch: all
